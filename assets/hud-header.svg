<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffe082"/>
      <stop offset="70%" stop-color="#ff6f00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b71c1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffd700" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <!-- scan line -->
    <rect x="0" y="0" width="1000" height="2" fill="#ffd700" opacity="0.18">
      <animate attributeName="y" values="0;258;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="998" height="258" rx="14" fill="none" stroke="#8b0000" stroke-opacity="0.7"/>

  <!-- corner brackets -->
  <g stroke="#ffd700" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M16 46V16H46"/>
    <path d="M954 16H984V46"/>
    <path d="M16 214V244H46"/>
    <path d="M954 244H984V214"/>
  </g>

  <!-- energy core -->
  <g transform="translate(150 130)">
    <circle r="100" fill="none" stroke="#ffd700" stroke-opacity="0.15"/>
    <circle r="92" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="40 14 6 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="74" fill="none" stroke="#c62828" stroke-width="6" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" fill="none" stroke="#ffd700" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="90 30">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" fill="#1a0a0a" stroke="#ff8f00" stroke-opacity="0.5"/>
    <circle r="40" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="34;40;34" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- text block -->
  <text x="290" y="62" fill="#ffd700" font-size="14" letter-spacing="3">◢ HUD // SEXTA-FEIRA v1.0</text>
  <text x="290" y="112" fill="#f5f5f5" font-size="44" font-weight="700" letter-spacing="4" filter="url(#glow)">PEDRO DOS SANTOS</text>
  <text x="290" y="144" fill="#c9d1d9" font-size="16">Software Engineering · Docs &amp; Logistics · Lins, BR</text>

  <!-- status -->
  <circle cx="296" cy="183" r="5" fill="#ffd700">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="310" y="188" fill="#ffd700" font-size="13" letter-spacing="2">ALL SYSTEMS ONLINE</text>
  <text x="560" y="188" fill="#8b949e" font-size="13" letter-spacing="2">LOADING SKILLS</text>

  <rect x="290" y="204" width="560" height="8" rx="4" fill="#21262d"/>
  <rect x="290" y="204" width="0" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" values="0;560;560" keyTimes="0;0.8;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="870" y="212" fill="#8b949e" font-size="12">
    <tspan>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.8;1" dur="5s" repeatCount="indefinite"/>100%
    </tspan>
  </text>
</svg>
