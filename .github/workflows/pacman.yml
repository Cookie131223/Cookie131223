name: generate animation

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate pacman.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman.svg?color_snake=#B8860B&snake_type=pacman&color_dots=#ebedf0,#ffcdd2,#e57373,#c62828,#8b0000
            dist/pacman-dark.svg?color_snake=#FFD700&snake_type=pacman&palette=github-dark&color_dots=#161b22,#4a0d0d,#8b1a1a,#c62828,#ff5252

      - name: push pacman.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
